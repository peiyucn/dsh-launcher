name: Auto-close external PRs

# 个人独立开发项目：不接受 PR，只通过 Issue 收集反馈。
# 用 pull_request_target（而非 pull_request）是因为 fork 触发的 PR
# 事件里 GITHUB_TOKEN 只有只读权限，无法关闭 PR；本 workflow 不检出
# PR 代码、只调用 gh pr close，因此是安全的。
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    name: Close external PR
    runs-on: ubuntu-latest
    # 仓库所有者自己的 PR 不关（自己可能需要分支间合并）
    if: github.event.pull_request.user.login != github.repository_owner
    steps:
      - name: Close pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "感谢关注！本仓库为个人独立开发项目，不接受 Pull Request。请改用 Issue 反馈问题或建议：https://github.com/$GITHUB_REPOSITORY/issues"
