name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  package-check:
    name: Verify vsce package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Package extension (verify)
        run: npx --yes @vscode/vsce package --no-dependencies

      - name: Verify VSIX artifact exists
        run: |
          ls -la *.vsix
          test -f *.vsix || (echo "VSIX not produced" && exit 1)
